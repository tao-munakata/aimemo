services:
  aimemo:
    build: .
    container_name: aimemo
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${VAULT_PATH:-/Users/tao/ai/obsidian}:/vault
      - ./public:/app/public
    environment:
      - VAULT_PATH=/vault
      - VAULT_NAME=${VAULT_NAME:-obsidian}
      - AI_MODE=${AI_MODE:-none}
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://host.docker.internal:1234/v1}
      - LM_STUDIO_MODEL=${LM_STUDIO_MODEL:-gemma-4-12b-it}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PORT=3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
